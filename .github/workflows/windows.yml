name: Windows build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write  # attach files to the GitHub release on v* tags

jobs:
  tests:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install pytest pyserial pyyaml python-dotenv numpy psutil
      - name: Run tests
        run: python -m pytest

  build:
    name: Build exe and installer
    needs: tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # PyInstaller's prebuilt launcher is shared by many malware samples, so antivirus engines flag
      # anything built with it. Compiling our own launcher gives the exe a unique, unflagged one.
      - name: Install PyInstaller with a launcher compiled from source
        shell: pwsh
        run: |
          python -m pip download --no-binary :all: --no-deps --no-cache-dir pyinstaller -d pyi-src
          python -c "import glob, tarfile; tarfile.open(glob.glob('pyi-src/pyinstaller-*.tar.gz')[0]).extractall('pyi-src', filter='data')"
          $src = (Get-ChildItem pyi-src -Directory | Select-Object -First 1).FullName
          Push-Location "$src\bootloader"
          python ./waf all --target-arch=64bit
          if ($LASTEXITCODE -ne 0) { throw "Compiling the PyInstaller launcher failed" }
          Pop-Location
          python -m pip install $src
          # Show the launcher's hash, to compare with the prebuilt one if needed
          python -c "import hashlib, os, PyInstaller; p = os.path.join(os.path.dirname(PyInstaller.__file__), 'bootloader', 'Windows-64bit-intel', 'runw.exe'); print(p, hashlib.sha256(open(p, 'rb').read()).hexdigest())"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest

      - name: Run tests with the full dependencies
        run: python -m pytest

      - name: Read version from pyproject.toml
        id: version
        shell: pwsh
        run: |
          $version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])"
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Version $version"

      - name: Build one-dir (for the installer)
        run: python -m PyInstaller led_mon.spec --noconfirm --clean --workpath build\onedir

      # The fps app runs Intel's PresentMon (MIT licence). The installer ships it next to led_mon.exe;
      # it isn't packed inside the portable exe, since an exe hidden inside another looks suspicious to scanners.
      - name: Add PresentMon to the installed app
        shell: pwsh
        env:
          PRESENTMON_VERSION: v2.6.0
        run: |
          $headers = @{ Authorization = "Bearer ${{ github.token }}"; "X-GitHub-Api-Version" = "2022-11-28" }
          $release = Invoke-RestMethod -Headers $headers "https://api.github.com/repos/GameTechDev/PresentMon/releases/tags/$env:PRESENTMON_VERSION"
          $asset = @($release.assets | Where-Object { $_.name -match '^PresentMon-[\d.]+-x64\.exe$' })
          if ($asset.Count -ne 1) {
            $release.assets | ForEach-Object { Write-Host $_.name }
            throw "Expected one PresentMon console exe in release $env:PRESENTMON_VERSION"
          }
          Write-Host "Using $($asset[0].name)"
          Invoke-WebRequest -Headers $headers $asset[0].browser_download_url -OutFile dist\led_mon\PresentMon.exe
          $license = Invoke-RestMethod -Headers $headers "https://api.github.com/repos/GameTechDev/PresentMon/license?ref=$env:PRESENTMON_VERSION"
          [IO.File]::WriteAllBytes("$PWD\dist\led_mon\PresentMon-LICENSE.txt", [Convert]::FromBase64String($license.content))
          Get-AuthenticodeSignature dist\led_mon\PresentMon.exe | Format-List Status, SignerCertificate

      - name: Build one-file (portable exe)
        shell: pwsh
        run: |
          $env:LED_MON_ONEFILE = "1"
          python -m PyInstaller led_mon.spec --noconfirm --clean --workpath build\onefile

      - name: Smoke test (--list-apps, no panels needed)
        shell: pwsh
        run: |
          foreach ($exe in @("dist\led_mon.exe", "dist\led_mon\led_mon.exe")) {
            Write-Host "== $exe --list-apps"
            # The exe is windowless, so start it explicitly and wait for its exit code
            $p = Start-Process -FilePath $exe -ArgumentList "--list-apps" -PassThru -NoNewWindow `
                 -RedirectStandardOutput smoke-out.txt -RedirectStandardError smoke-err.txt
            $null = $p.Handle
            if (-not $p.WaitForExit(120000)) { $p.Kill(); throw "$exe --list-apps did not exit" }
            Get-Content smoke-out.txt, smoke-err.txt -ErrorAction SilentlyContinue
            if ($p.ExitCode -ne 0) { throw "$exe --list-apps exited with $($p.ExitCode)" }
          }

      - name: Smoke test (layout editor opens and closes)
        shell: pwsh
        run: |
          $env:LED_MON_EDITOR_SMOKE_TEST = "1"
          $env:APPDATA = "$PWD\smoke-appdata"
          $env:LOCALAPPDATA = "$PWD\smoke-appdata"
          foreach ($exe in @("dist\led_mon.exe", "dist\led_mon\led_mon.exe")) {
            Write-Host "== $exe --edit-layout"
            $p = Start-Process -FilePath $exe -ArgumentList "--edit-layout" -PassThru
            $null = $p.Handle
            if (-not $p.WaitForExit(120000)) { $p.Kill(); throw "$exe --edit-layout did not exit" }
            Get-Content smoke-appdata\led_mon\led_mon.log -ErrorAction SilentlyContinue
            if ($p.ExitCode -ne 0) { throw "$exe --edit-layout exited with $($p.ExitCode)" }
          }

      # Code signing placeholder (not enabled yet). Unsigned builds show a SmartScreen warning.
      # - name: Sign executables
      #   shell: pwsh
      #   run: |
      #     signtool sign /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 `
      #       /f cert.pfx /p "${{ secrets.SIGNING_CERT_PASSWORD }}" dist\led_mon.exe dist\led_mon\led_mon.exe

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=${{ steps.version.outputs.version }}" installer\led_mon.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }

      - name: Upload portable exe
        uses: actions/upload-artifact@v4
        with:
          name: led_mon.exe
          path: dist/led_mon.exe
          if-no-files-found: error

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: led_mon-setup-${{ steps.version.outputs.version }}.exe
          path: dist/led_mon-setup-${{ steps.version.outputs.version }}.exe
          if-no-files-found: error

      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/led_mon.exe
            dist/led_mon-setup-${{ steps.version.outputs.version }}.exe
